name: Verify Apple silicon release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete history for secrets
        run: |
          brew install gitleaks
          gitleaks git . --log-opts="--all --full-history" --redact --max-archive-depth 3
      - name: Verify website links and Discover routing
        run: |
          python3 scripts/prepare-website.py
          node --test website/worker.test.mjs
      - name: Build and verify an Apple silicon DMG
        run: python3 scripts/release.py build 0.1.0 --unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geet-apple-silicon-ci-unsigned
          path: |
            build/releases/0.1.0/geet-apple-silicon.dmg
            build/releases/0.1.0/SHA256SUMS
          retention-days: 7
